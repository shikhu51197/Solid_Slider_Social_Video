name: Production checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          YOUTUBE_API_KEY: client-secret-test-sentinel
      - run: npm run check:bundle
        env:
          YOUTUBE_API_KEY: client-secret-test-sentinel
